name: macOS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Swift style and tests
        run: make check
      - name: Sanitizer smoke
        run: make sanitize-smoke
      - name: Verify sandbox and signing policy
        run: make security-check
      # Ad-hoc signed development build for testing only; releases are built locally with
      # SIGNING_IDENTITY and NOTARY_PROFILE (see README).
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent dist/Hycrypt.app dist/Hycrypt-macOS.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Hycrypt-macOS-unsigned-dev
          path: dist/Hycrypt-macOS.zip
